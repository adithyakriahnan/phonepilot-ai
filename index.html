<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePilot - Smart Phone Recommendations & Comparison</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.5);
            --badge-bg: rgba(49, 46, 129, 0.6);
            --badge-text: #a5b4fc;
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.1) 0px, transparent 60%);
            color: var(--text-main);
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 25px 0 35px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
            background: rgba(30, 41, 59, 0.25);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--glass-shadow);
            height: fit-content;
        }

        .panel h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Liquid Glass Custom Range Slider */
        .form-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
            outline: none;
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            margin: 8px 0;
        }

        .form-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, var(--accent));
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8), 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background 0.2s;
        }

        .form-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: linear-gradient(135deg, #a5b4fc, var(--accent-hover));
        }

        .form-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #818cf8, var(--accent));
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8), 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .range-val {
            text-align: right;
            font-weight: bold;
            color: var(--badge-text);
            font-size: 0.9rem;
            text-shadow: 0 0 8px rgba(165, 180, 252, 0.4);
        }

        select, input[type="text"] {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-main);
            font-size: 0.95rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .catalog-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-container {
            display: flex;
            align-items: center;
            position: relative;
            flex: 2;
            min-width: 280px;
        }

        .search-container input {
            width: 100%;
            padding-right: 40px;
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        .catalog-controls select {
            flex: 1;
            min-width: 160px;
        }

        .catalog-status {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .phone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .phone-card {
            background-color: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: var(--glass-shadow);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
        }

        .phone-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 40px 0 rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .match-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--badge-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--badge-text);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.4);
        }

        .phone-card h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            padding-right: 60px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .brand-tag {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .release-date-tag {
            font-size: 0.85rem;
            color: var(--badge-text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .specs-list {
            list-style: none;
            margin: 15px 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .specs-list li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 4px;
        }

        .specs-list li strong {
            color: var(--text-main);
        }

        .price-tag {
            font-size: 1.3rem;
            font-weight: bold;
            color: #34d399;
            margin: 10px 0;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            filter: brightness(1.1);
        }

        .btn.selected {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .compare-section {
            margin-top: 40px;
            background-color: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--glass-shadow);
        }

        .compare-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .compare-table-wrapper {
            overflow-x: auto;
        }

        table.compare-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            min-width: 600px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table.compare-table th, table.compare-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.3);
        }

        table.compare-table th:last-child, table.compare-table td:last-child {
            border-right: none;
        }

        table.compare-table tr:last-child td {
            border-bottom: none;
        }

        table.compare-table th {
            background-color: rgba(30, 41, 59, 0.6);
            color: var(--badge-text);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            background: rgba(30, 41, 59, 0.2);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }
    </style>
</head>

        </aside>

        <main>
            <div class="catalog-controls">

                    <button class="clear-btn" id="clear-search-btn" title="Clear Search">×</button>

                <select id="sort-select">
                    <option value="recommended">Recommended</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="price-asc">Price: Low → High</option>
                    <option value="price-desc">Price: High → Low</option>
                    <option value="name-asc">Name: A → Z</option>

            </div>

            <div class="catalog-status" id="catalog-status">
                Showing 0 of 0 phones
            </div>

            <div class="phone-grid" id="phone-grid">
                </div>
        </main>
    </div>

            <p style="color: var(--text-muted);">Select up to 4 phones from the catalog above to compare specs side-by-side.</p>

    </section>

            { id: "realme-gt-7", name: "Realme GT 7", brand: "Realme", price: 49999, releaseDate: "May 2025", camera: 8, gaming: 10, battery: 10, display: 9, chip: "Dimensity 9400e", batteryCap: "7000 mAh" },
            { id: "realme-14-pro-plus", name: "Realme 14 Pro+", brand: "Realme", price: 29999, releaseDate: "January 2025", camera: 8, gaming: 7, battery: 9, display: 8, chip: "Snapdragon 7s Gen 3", batteryCap: "5200 mAh" },

            // Motorola
            { id: "motorola-edge-50-ultra", name: "Motorola Edge 50 Ultra", brand: "Motorola", price: 59999, releaseDate: "April 2024", camera: 9, gaming: 9, battery: 8, display: 10, chip: "Snapdragon 8s Gen 3", batteryCap: "4500 mAh" },
            { id: "motorola-g85-5g", name: "Motorola Moto G85 5G", brand: "Motorola", price: 17999, releaseDate: "June 2024", camera: 7, gaming: 6, battery: 9, display: 8, chip: "Snapdragon 6s Gen 3", batteryCap: "5000 mAh" },

            // Google
            { id: "google-pixel-9-pro", name: "Google Pixel 9 Pro", brand: "Google", price: 109999, releaseDate: "August 2024", camera: 10, gaming: 7, battery: 8, display: 9, chip: "Tensor G4", batteryCap: "4700 mAh" },
            { id: "google-pixel-8a", name: "Google Pixel 8a", brand: "Google", price: 52999, releaseDate: "May 2024", camera: 9, gaming: 7, battery: 7, display: 8, chip: "Tensor G3", batteryCap: "4492 mAh" },

            // Nothing / CMF
            { id: "nothing-phone-2", name: "Nothing Phone (2)", brand: "Nothing", price: 36999, releaseDate: "July 2023", camera: 8, gaming: 8, battery: 8, display: 9, chip: "Snapdragon 8+ Gen 1", batteryCap: "4700 mAh" },
            { id: "cmf-phone-1", name: "CMF Phone 1 by Nothing", brand: "Nothing", price: 15999, releaseDate: "July 2024", camera: 7, gaming: 7, battery: 8, display: 8, chip: "Dimensity 7300", batteryCap: "5000 mAh" },

            // Tecno / Infinix
            { id: "tecno-pova-6-pro-5g", name: "Tecno Pova 6 Pro 5G", brand: "Tecno", price: 19999, releaseDate: "March 2024", camera: 6, gaming: 7, battery: 9, display: 8, chip: "Dimensity 6080", batteryCap: "6000 mAh" },
            { id: "infinix-gt-20-pro", name: "Infinix GT 20 Pro", brand: "Infinix", price: 24999, releaseDate: "May 2024", camera: 7, gaming: 9, battery: 8, display: 9, chip: "Dimensity 8200 Ultimate", batteryCap: "5000 mAh" },

            // Lava / Itel
            { id: "lava-agni-3-5g", name: "Lava Agni 3 5G", brand: "Lava", price: 20999, releaseDate: "October 2024", camera: 7, gaming: 8, battery: 8, display: 8, chip: "Dimensity 7300X", batteryCap: "5000 mAh" },
            { id: "itel-colorpro-5g", name: "Itel ColorPro 5G", brand: "Itel", price: 9999, releaseDate: "July 2024", camera: 5, gaming: 5, battery: 8, display: 6, chip: "Dimensity 6080", batteryCap: "5000 mAh" }
        ];

        let selectedForCompare = [];

        // DOM Handles
        const budgetInput = document.getElementById('budget');
        const budgetVal = document.getElementById('budget-val');
        const brandFilter = document.getElementById('brand-filter');
        const pCamera = document.getElementById('p-camera');
        const pGaming = document.getElementById('p-gaming');
        const pBattery = document.getElementById('p-battery');
        const pDisplay = document.getElementById('p-display');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const sortSelect = document.getElementById('sort-select');
        const phoneGrid = document.getElementById('phone-grid');
        const catalogStatus = document.getElementById('catalog-status');

        // Dynamically Populate Brand Filter Dropdown
        function initBrandFilter() {
            const brands = [...new Set(phoneDatabase.map(p => p.brand))].sort();
            brandFilter.innerHTML = '<option value="All">All Brands</option>';
            brands.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                brandFilter.appendChild(opt);
            });
        }

        // Format numbers to Indian Currency standard
        function formatINR(val) {
            return '₹' + Number(val).toLocaleString('en-IN');
        }

        // Parse Date strings to timestamp for robust sorting
        function parseReleaseDate(dateStr) {
            if (dateStr.startsWith("Upcoming")) return 9999999999999;
            if (dateStr.startsWith("Expected:")) {
                const cleaned = dateStr.replace("Expected:", "").trim();
                return new Date(cleaned).getTime() || 8888888888888;
            }
            return new Date(dateStr).getTime() || 0;
        }

        function calculateMatchScore(phone) {
            const wCam = parseInt(pCamera.value);
            const wGam = parseInt(pGaming.value);
            const wBat = parseInt(pBattery.value);
            const wDis = parseInt(pDisplay.value);

            const maxScore = (wCam + wGam + wBat + wDis) * 10;
            if (maxScore === 0) return 100;

            const actualScore = (phone.camera * wCam) + (phone.gaming * wGam) + (phone.battery * wBat) + (phone.display * wDis);
            return Math.round((actualScore / maxScore) * 100);
        }

        function renderCatalog() {
            const maxBudget = parseInt(budgetInput.value);
            const selectedBrand = brandFilter.value;
            const searchTerm = searchInput.value.toLowerCase().trim();
            const sortMode = sortSelect.value;

            // Toggle clear button visibility
            clearSearchBtn.style.display = searchTerm ? 'flex' : 'none';

            // 1. Unified Search & Filtering
            let filtered = phoneDatabase.filter(phone => {
                const matchesBudget = phone.price <= maxBudget;
                const matchesBrand = selectedBrand === "All" || phone.brand === selectedBrand;
                const matchesSearch = !searchTerm || 
                                    phone.name.toLowerCase().includes(searchTerm) || 
                                    phone.brand.toLowerCase().includes(searchTerm) ||
                                    phone.chip.toLowerCase().includes(searchTerm) ||
                                    phone.releaseDate.toLowerCase().includes(searchTerm);

                return matchesBudget && matchesBrand && matchesSearch;
            });

            // Update Dynamic Phone Counter Status
            catalogStatus.innerText = `Showing ${filtered.length} of ${phoneDatabase.length} phones`;

            // 2. Map Match Scores
            filtered = filtered.map(phone => ({
                ...phone,
                matchScore: calculateMatchScore(phone)
            }));

            // 3. Sort
            filtered.sort((a, b) => {
                if (sortMode === "recommended") return b.matchScore - a.matchScore;
                if (sortMode === "price-asc") return a.price - b.price;
                if (sortMode === "price-desc") return b.price - a.price;
                if (sortMode === "name-asc") return a.name.localeCompare(b.name);
                if (sortMode === "newest") return parseReleaseDate(b.releaseDate) - parseReleaseDate(a.releaseDate);
                if (sortMode === "oldest") return parseReleaseDate(a.releaseDate) - parseReleaseDate(b.releaseDate);
                return 0;
            });

            // 4. Render Grid Cards
            phoneGrid.innerHTML = "";
            if (filtered.length === 0) {
                phoneGrid.innerHTML = `<div class="no-results">No smartphones match your exact search and filter criteria.</div>`;
                return;
            }

            filtered.forEach(phone => {
                const isSelected = selectedForCompare.some(p => p.id === phone.id);
                const card = document.createElement('div');
                card.className = "phone-card";
                card.innerHTML = `
                    <span class="match-badge">${phone.matchScore}% Match</span>
                    <div>
                        <div class="brand-tag">${phone.brand}</div>
                        <h3>${phone.name}</h3>
                        <div class="release-date-tag">📅 Released: ${phone.releaseDate}</div>
                        <div class="price-tag">${formatINR(phone.price)}</div>
                        <ul class="specs-list">
                            <li><span>Chipset:</span> <strong>${phone.chip}</strong></li>
                            <li><span>Battery:</span> <strong>${phone.batteryCap}</strong></li>
                            <li><span>Camera Score:</span> <strong>${phone.camera}/10</strong></li>
                            <li><span>Gaming Score:</span> <strong>${phone.gaming}/10</strong></li>
                        </ul>
                    </div>
                    <button class="btn ${isSelected ? 'selected' : ''}" onclick="toggleCompare('${phone.id}')">
                        ${isSelected ? '✓ Added to Compare' : '+ Compare'}
                    </button>
                `;
                phoneGrid.appendChild(card);
            });
        }

        function toggleCompare(phoneId) {
            const index = selectedForCompare.findIndex(p => p.id === phoneId);
            if (index > -1) {
                selectedForCompare.splice(index, 1);
            } else {
                if (selectedForCompare.length >= 4) {
                    alert("You can compare up to 4 phones maximum.");
                    return;
                }
                const phone = phoneDatabase.find(p => p.id === phoneId);
                if (phone) selectedForCompare.push(phone);
            }
            renderCatalog();
            renderComparison();
        }

        function clearComparison() {
            selectedForCompare = [];
            renderCatalog();
            renderComparison();
        }

        function renderComparison() {
            const wrapper = document.getElementById('compare-table-wrapper');
            document.getElementById('compare-count').innerText = selectedForCompare.length;

            if (selectedForCompare.length === 0) {
                wrapper.innerHTML = `<p style="color: var(--text-muted);">Select up to 4 phones from the catalog above to compare specs side-by-side.</p>`;
                return;
            }

            let tableHTML = `<table class="compare-table"><thead><tr><th>Specification</th>`;
            selectedForCompare.forEach(p => {
                tableHTML += `<th>${p.name}</th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            const rows = [
                { label: "Brand", key: "brand" },
                { label: "Price", key: "price", format: v => formatINR(v) },
                { label: "Release Date", key: "releaseDate" },
                { label: "Chipset", key: "chip" },
                { label: "Battery Capacity", key: "batteryCap" },
                { label: "Camera Rating", key: "camera", format: v => `${v}/10` },
                { label: "Gaming Rating", key: "gaming", format: v => `${v}/10` },
                { label: "Display Rating", key: "display", format: v => `${v}/10` }
            ];

            rows.forEach(row => {
                tableHTML += `<tr><td><strong>${row.label}</strong></td>`;
                selectedForCompare.forEach(p => {
                    const val = row.format ? row.format(p[row.key]) : p[row.key];
                    tableHTML += `<td>${val}</td>`;
                });
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table>`;
            wrapper.innerHTML = tableHTML;
        }

        // Event Listeners
        budgetInput.addEventListener('input', (e) => {
            budgetVal.innerText = formatINR(e.target.value);
            renderCatalog();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderCatalog();
        });

        [brandFilter, pCamera, pGaming, pBattery, pDisplay, searchInput, sortSelect].forEach(element => {
            element.addEventListener('input', renderCatalog);
        });

        // Application Initialization
        initBrandFilter();
        renderCatalog();
    </script>
</body>
</html>
